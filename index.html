<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intra-Luzon Fuel Matrix Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf0f4; --surface:#ffffff; --ink:#12263a; --muted:#587086; --line:#cfdbe4;
  --wet:#0b6e8a; --wet-soft:#dcf0f6; --dry:#a85a00; --dry-soft:#fbead3;
  --focus:#1a5fd0; --err:#a1261f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a25; --surface:#162736; --ink:#e6eef5; --muted:#93a9bb; --line:#2a4155;
    --wet:#5cc4e0; --wet-soft:#123646; --dry:#f0a959; --dry-soft:#3b2810;
    --focus:#7fb0ff; --err:#ff8c84; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a25; --surface:#162736; --ink:#e6eef5; --muted:#93a9bb; --line:#2a4155;
  --wet:#5cc4e0; --wet-soft:#123646; --dry:#f0a959; --dry-soft:#3b2810;
  --focus:#7fb0ff; --err:#ff8c84; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --surface:#162736; } }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:1.65rem;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);
  padding:11px 8px;border-radius:7px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"].wet{background:var(--wet);color:#fff}
.seg button[aria-pressed="true"].dry{background:var(--dry);color:#fff}
.seg button:focus-visible,.swap:focus-visible,.clear:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.field{position:relative;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.inwrap{position:relative}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:8px;padding:12px 40px 12px 12px;min-height:48px}
input[type=text]:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;
  background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;display:none;border-radius:8px}
.field.has-val .clear{display:block}
.list{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(10,30,50,.18);display:none}
.list.open{display:block}
.list li{padding:10px 10px;border-radius:6px;cursor:pointer}
.list li[aria-selected="true"],.list li:hover{background:var(--wet-soft)}
.list li.none{color:var(--muted);cursor:default}
.list li.none:hover{background:transparent}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.swaprow{display:flex;justify-content:center;margin:-2px 0 6px}
.swap{font:inherit;font-size:.9rem;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:20px;padding:7px 16px;min-height:40px;cursor:pointer}
#result{margin-top:18px}
.route{font-size:.95rem;color:var(--muted);margin:0 0 10px}
.route strong{color:var(--ink);font-weight:600}
.card{border-radius:10px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden}
.card.wet{border-color:var(--wet)} .card.dry{border-color:var(--dry)}
.kmrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card.wet .kmrow{background:var(--wet-soft)} .card.dry .kmrow{background:var(--dry-soft)}
.kmrow span{font-weight:500}
.kmrow b{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.kmrow small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:.82rem;font-weight:500;color:var(--muted);background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-weight:600;font-size:1.1rem}
.msg{padding:14px 16px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg button{font:inherit;font-weight:600;color:var(--focus);background:none;border:0;padding:6px 0 0;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);padding:6px 2px}
.status{margin:20px 0 0;font-size:.82rem;color:var(--muted)}.status.bad{color:var(--err)}
footer{margin-top:8px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.4}to{opacity:1}} }

.field{margin-bottom:12px}
.field.open{z-index:30}
.lblrow{display:flex;align-items:center;justify-content:space-between;min-height:28px;margin-bottom:5px}
.lblrow label{margin:0}
.rm{font:inherit;font-size:.85rem;font-weight:500;color:var(--err);background:none;border:0;padding:6px 4px;min-height:36px;cursor:pointer;text-decoration:underline}
.rm:focus-visible,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{border-color:var(--ink)}
.btn.ghost{color:var(--muted);font-weight:500}
.totalcard{margin-top:18px}
.tot-title{font-weight:600;margin:0 0 8px}
.warn{margin:0 0 12px}
.legs{margin-top:16px}
.legs h2{font-size:1rem;font-weight:600;margin:0 0 8px}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.leg.miss{border-color:var(--err)}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lroute{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lkm{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.lnum{font-size:.82rem;color:var(--muted);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.chips b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.leg .err{color:var(--err);font-size:.9rem;margin-top:6px}
.copied{font-size:.85rem;color:var(--muted);align-self:center}
</style>
</head>

  <section class="panel" aria-label="Biyahe">
    <div class="seg" role="group" aria-label="Uri ng lease">

      <button type="button" class="dry" id="bDry" aria-pressed="false">Dry lease</button>
    </div>
    <div id="stops"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="add">Dagdag na stop</button>
      <button type="button" class="btn ghost" id="reset">Ulitin</button>
    </div>
  </section>

  <div id="result" aria-live="polite"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <footer>Pinagmulan: Intra Luzon Fuel Matrix, sheet na drylease_matrix. Ang litro ay ayon sa matrix.</footer>
</main>

const BUILT_ON = "Nov 14, 2026";
const WET_V = ["4WAUV","4WCV","6WH","6WF","10WH"];
const DRY_V = ["4WAUV","4WCV","6WH","6WF","10WH","Shacman 6WH"];
const $ = id => document.getElementById(id);

let NAMES=[], ROUTES=[], pair=new Map(), destsOf=[], origsOf=[], allOrigins=[], allDests=[], lowerIdx=new Map();
function byName(a,b){ return NAMES[a].localeCompare(NAMES[b], undefined, {numeric:true, sensitivity:"base"}); }
function setData(db){
  NAMES=db.n; ROUTES=db.r; pair=new Map();
  destsOf=NAMES.map(()=>new Set()); origsOf=NAMES.map(()=>new Set());
  for (const r of ROUTES){ pair.set(r[0]+"|"+r[1], r); destsOf[r[0]].add(r[1]); origsOf[r[1]].add(r[0]); }
  allOrigins=[...new Set(ROUTES.map(r=>r[0]))].sort(byName);
  allDests=[...new Set(ROUTES.map(r=>r[1]))].sort(byName);
  lowerIdx=new Map(NAMES.map((n,i)=>[n.toLowerCase(), i]));
}
setData(EMBEDDED);

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c==="\r"){}
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function toNum(s){
  if(s==null) return NaN; s=String(s).replace(/,/g,"").trim();
  if(s==="") return NaN; const n=Number(s); return Number.isFinite(n)?n:NaN;
}
function dbFromRows(rows){
  const names=[], idx=new Map(), seen=new Set(), routes=[];
  const ix=n=>{ if(!idx.has(n)){ idx.set(n,names.length); names.push(n);} return idx.get(n); };
  for(let k=0;k<rows.length;k++){
    const r=rows[k]; if(!r) continue;
    const o=(r[2]||"").trim(), d=(r[3]||"").trim(); if(!o||!d) continue;
    const vals=[r[8],r[9],r[10],r[11],r[12],r[13],r[24],r[25],r[26],r[27],r[28],r[29]].map(toNum);
    if(vals.some(isNaN)) continue;
    const key=o+"|"+d; if(seen.has(key)) continue; seen.add(key);
    routes.push([ix(o),ix(d),...vals.map(v=>Math.round(v*10)/10)]);
  }
  return {n:names, r:routes};
}
function remap(){
  stops = texts.map(t=>{ const m=lowerIdx.get((t||"").trim().toLowerCase()); return m===undefined?null:m; });
}
function setStatus(msg, bad){ const s=$("status"); s.textContent=msg; s.classList.toggle("bad",!!bad); }
async function loadLive(){
  if(!SHEET_CSV){ setStatus("Naka-save na kopya mula sa Excel ("+BUILT_ON+"). Hindi pa nakakabit sa Google Sheet."); return; }
  setStatus("Kinukuha ang pinakabagong data mula sa Google Sheet...");
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),25000);
    const resp=await fetch(SHEET_CSV,{cache:"no-store",signal:ctrl.signal}); clearTimeout(to);
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const db=dbFromRows(parseCSV(await resp.text()));
    if(db.r.length<100) throw new Error("Kaunti ang nabasang route");
    setData(db); remap(); update();
    const now=new Date().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"});
    setStatus("Live mula sa Google Sheet: "+db.r.length.toLocaleString("en-US")+" route, na-load noong "+now+".");
  }catch(e){
    setStatus("Hindi nabasa ang Google Sheet. Gamit ang naka-save na kopya mula "+BUILT_ON+".", true);
  }
}

let lease = "wet";
let stops = [null, null];
let texts = ["", ""];
const stopsEl = $("stops");

function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(n){ return (Math.round(n*10)/10).toLocaleString("en-US",{maximumFractionDigits:1}); }
function labelFor(k,n){ return k===0 ? "Origin" : (k===n-1 ? "Destination" : "Stop "+(k+1)); }

function poolFor(k){
  const prev = k>0 ? stops[k-1] : null;
  const next = k<stops.length-1 ? stops[k+1] : null;
  let base;
  if(prev!=null && next!=null) base=[...destsOf[prev]].filter(i=>origsOf[next].has(i));
  else if(prev!=null) base=[...destsOf[prev]];
  else if(next!=null) base=[...origsOf[next]];
  else base = k===0 ? allOrigins : allDests;
  return base.sort(byName);
}

function buildRows(focusIdx){
  stopsEl.innerHTML = "";
  const n = stops.length;
  for(let k=0;k<n;k++) stopsEl.appendChild(makeRow(k,n));
  update();
  if(focusIdx!=null){ const el=stopsEl.querySelectorAll("input")[focusIdx]; if(el) el.focus(); }
}

function makeRow(k,n){
  const f=document.createElement("div");
  f.className="field"+(texts[k]?" has-val":"");
  const lab=labelFor(k,n);
  f.innerHTML =
    '<div class="lblrow"><label for="in'+k+'">'+lab+'</label>'+
    (n>2?'<button type="button" class="rm" aria-label="Alisin ang '+lab+'">Alisin</button>':'')+'</div>'+
    '<div class="inwrap"><input type="text" id="in'+k+'" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="ls'+k+'" aria-autocomplete="list" placeholder="'+(k===0?"Mag-type ng origin, hal. SOC 5":"Mag-type ng susunod na stop")+'">'+
    '<button type="button" class="clear" aria-label="Burahin ang '+lab+'">×</button></div>'+
    '<ul class="list" id="ls'+k+'" role="listbox"></ul>';
  const input=f.querySelector("input"), list=f.querySelector("ul"), clearBtn=f.querySelector(".clear"), rm=f.querySelector(".rm");
  input.value=texts[k];
  let items=[], active=-1;

  function render(){
    const q=input.value.trim().toLowerCase();
    const words=q.split(/\s+/).filter(Boolean);
    items=poolFor(k).filter(i=>{const nm=NAMES[i].toLowerCase(); return words.every(w=>nm.includes(w));});
    if(q) items.sort((a,b)=>{const pa=NAMES[a].toLowerCase().startsWith(q)?0:1, pb=NAMES[b].toLowerCase().startsWith(q)?0:1; return pa-pb||byName(a,b);});
    list.innerHTML="";
    if(!items.length){ const li=document.createElement("li"); li.className="none"; li.textContent="Walang tugma"; list.appendChild(li); }
    items.slice(0,60).forEach(i=>{
      const li=document.createElement("li"); li.setAttribute("role","option"); li.textContent=NAMES[i]; li.dataset.i=i;
      li.addEventListener("mousedown",e=>{e.preventDefault(); pick(i);});
      li.addEventListener("touchend",e=>{e.preventDefault(); pick(i);});
      list.appendChild(li);
    });
    if(items.length>60){ const li=document.createElement("li"); li.className="none"; li.textContent="… "+(items.length-60)+" pa. Mag-type para paliitin."; list.appendChild(li); }
    active=-1;
  }
  function open(){ render(); list.classList.add("open"); f.classList.add("open"); input.setAttribute("aria-expanded","true"); }
  function close(){ list.classList.remove("open"); f.classList.remove("open"); input.setAttribute("aria-expanded","false"); }
  function pick(i){ input.value=NAMES[i]; texts[k]=NAMES[i]; stops[k]=i; f.classList.add("has-val"); close(); update(); }
  function setActive(nn){
    const lis=[...list.querySelectorAll("li[role=option]")]; if(!lis.length) return;
    active=(nn+lis.length)%lis.length;
    lis.forEach((li,x)=>li.setAttribute("aria-selected",x===active));
    lis[active].scrollIntoView({block:"nearest"});
  }
  input.addEventListener("focus",()=>{ input.select(); open(); });
  input.addEventListener("input",()=>{
    texts[k]=input.value; const m=lowerIdx.get(input.value.trim().toLowerCase());
    stops[k]=(m===undefined)?null:m; f.classList.toggle("has-val",!!input.value); open(); update();
  });
  input.addEventListener("blur",()=>setTimeout(close,120));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault(); if(!list.classList.contains("open")) open(); setActive(active+1);}
    else if(e.key==="ArrowUp"){e.preventDefault(); setActive(active-1);}
    else if(e.key==="Enter"){ const lis=list.querySelectorAll("li[role=option]"); const t=active>=0?lis[active]:(lis.length===1?lis[0]:null); if(t){e.preventDefault(); pick(+t.dataset.i);} }
    else if(e.key==="Escape"){ close(); }
  });
  clearBtn.addEventListener("click",()=>{ input.value=""; texts[k]=""; stops[k]=null; f.classList.remove("has-val"); update(); input.focus(); });
  if(rm) rm.addEventListener("click",()=>{ stops.splice(k,1); texts.splice(k,1); buildRows(); });
  return f;
}

function setLease(l){
  lease=l;
  $("bWet").setAttribute("aria-pressed", l==="wet");
  $("bDry").setAttribute("aria-pressed", l==="dry");
  update();
}
$("bWet").onclick=()=>setLease("wet");
$("bDry").onclick=()=>setLease("dry");
$("add").onclick=()=>{ stops.push(null); texts.push(""); buildRows(stops.length-1); };
$("reset").onclick=()=>{ stops=[null,null]; texts=["",""]; buildRows(); };

let lastSummary="";
function update(){
  const res=$("result");
  const vehicles = lease==="wet" ? WET_V : DRY_V;
  const cls = lease==="wet" ? "wet" : "dry";
  const legs=[];
  for(let k=0;k<stops.length-1;k++){
    const a=stops[k], b=stops[k+1];
    if(a==null || b==null) continue;
    legs.push({n:k+1,a,b,r:pair.get(a+"|"+b), rev:pair.get(b+"|"+a)});
  }
  if(!legs.length){
    res.innerHTML='<p class="empty">Pumili ng origin at destination para lumabas ang resulta.</p>'; lastSummary=""; return;
  }
  let km=0, tot=vehicles.map(()=>0), found=0;
  for(const L of legs){
    if(!L.r) continue;
    found++; km+=L.r[2];
    const vals = lease==="wet" ? L.r.slice(3,8) : L.r.slice(8,14);
    vals.forEach((v,x)=>tot[x]+=v);
  }
  const missing = legs.length-found;
  const legCountTxt = legs.length+" leg";
  const pendingStops = stops.some(s=>s==null);

  let html='';
  if(missing>0) html+='<div class="msg err warn"><strong>Kulang ang data.</strong> '+missing+' sa '+legs.length+' leg ang walang data sa matrix, kaya hindi kasama sa total.</div>';
  else if(pendingStops) html+='<div class="msg warn">May stop na hindi pa napipili. Ang total ay para sa mga leg na kumpleto lang.</div>';

  const rows=vehicles.map((v,x)=>'<tr><td>'+esc(v)+'</td><td class="n">'+fmt(tot[x])+' L</td></tr>').join("");
  html+='<div class="card '+cls+' totalcard" style="margin-top:0">'+
    '<div class="kmrow"><span>Kabuuang distansya ('+found+' leg)</span><div><b>'+fmt(km)+'</b><small>km</small></div></div>'+
    '<table><thead><tr><th>Uri ng sasakyan</th><th class="n">Kabuuang gasolina ('+(lease==="wet"?"wet lease":"dry lease")+')</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  html+='<div class="actions" style="margin-top:10px"><button type="button" class="btn" id="copy">Kopyahin ang buod</button><span class="copied" id="copied"></span></div>';

  html+='<section class="legs"><h2>Hati-hati ng biyahe</h2>';
  for(const L of legs){
    const route='<span class="lroute">'+esc(NAMES[L.a])+' → '+esc(NAMES[L.b])+'</span>';
    if(L.r){
      const vals = lease==="wet" ? L.r.slice(3,8) : L.r.slice(8,14);
      html+='<div class="leg"><div class="lnum">Leg '+L.n+'</div><div class="lhead">'+route+'<span class="lkm">'+L.r[2]+' km</span></div>'+
        '<div class="chips">'+vehicles.map((v,x)=>'<span>'+esc(v)+' <b>'+vals[x]+' L</b></span>').join("")+'</div></div>';
    } else {
      html+='<div class="leg miss"><div class="lnum">Leg '+L.n+'</div><div class="lhead">'+route+'</div>'+
        '<div class="err">Walang data para sa leg na ito.'+(L.rev?' Mayroong data para sa baligtad na route ('+esc(NAMES[L.b])+' papuntang '+esc(NAMES[L.a])+').':'')+'</div></div>';
    }
  }
  html+='</section>';
  res.innerHTML=html;

  const lines=[(lease==="wet"?"Wet lease":"Dry lease")+" - "+legs.map(L=>NAMES[L.a]).concat([NAMES[legs[legs.length-1].b]]).join(" > ")];
  lines.push("Kabuuang distansya: "+fmt(km)+" km");
  vehicles.forEach((v,x)=>lines.push(v+": "+fmt(tot[x])+" L"));
  if(missing>0) lines.push("Paalala: "+missing+" leg ang walang data at hindi kasama sa total.");
  lastSummary=lines.join("\n");
  $("copy").onclick=copySummary;
}

function copySummary(){
  const note=$("copied");
  const done=ok=>{ note.textContent = ok ? "Nakopya na." : "Hindi nakopya. Piliin at kopyahin nang mano-mano."; };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(lastSummary).then(()=>done(true),()=>done(false)); return; }
  }catch(e){}
  try{
    const ta=document.createElement("textarea"); ta.value=lastSummary; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); done(ok);
  }catch(e){ done(false); }
}

loadLive();
